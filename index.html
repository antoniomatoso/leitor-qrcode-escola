<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Entrada</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        /* --- ESTILOS GERAIS --- */
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 15px; 
            background-color: #f0f2f5; 
            margin: 0;
        }
        h2 { color: #333; margin-bottom: 5px; font-size: 24px; }
        
        /* --- INDICADOR DE OPERADOR --- */
        #info-operador {
            margin-bottom: 20px; 
            font-size: 16px; 
            font-weight: bold; 
            color: #0056b3;
        }

        /* --- CONTAINERS PRINCIPAIS --- */
        #scanner-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        #scanner-wrapper {
            position: relative;
            width: 100%;
        }

        #reader { 
            width: 100%; 
            border: none !important; 
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1); 
            box-sizing: border-box;
        }

        /* --- MENSAGEM SOBREPOSTA NO VÍDEO --- */
        #overlay-text {
            position: absolute;
            top: 40%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            font-weight: bold;
            text-align: center;
            width: 90%;
            pointer-events: none; 
            display: none;
        }

        .sucesso-overlay {
            color: #25d366; 
            font-size: 2.5em;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8), -2px -2px 5px rgba(0,0,0,0.8);
        }

        .erro-overlay {
            color: #dc3545;
            font-size: 1.5em;
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            text-shadow: none;
        }

        /* --- CUSTOMIZAÇÃO DOS BOTÕES DA BIBLIOTECA --- */
        #reader button {
            background-color: #0056b3; 
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%; 
            margin-top: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 86, 179, 0.3);
            text-transform: uppercase;
        }

        #reader button:active { transform: scale(0.98); }

        #reader select {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #fff;
            appearance: auto; 
        }

        #reader a {
            display: block;
            padding: 15px 10px;
            font-size: 16px;
            color: #555;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <h2>Controle de Entrada</h2>
    <div id="info-operador">Operador(a): Carregando...</div>
    
    <div id="scanner-container">
        <div id="scanner-wrapper">
            <div id="reader"></div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px; margin-bottom: 20px;">
        <button onclick="limparMemoriaHoje()" style="background-color: transparent; color: #dc3545; border: 1px solid #dc3545; padding: 8px 15px; border-radius: 5px; font-size: 14px; cursor: pointer;">
            🗑️ Zerar Memória de Hoje
        </button>
    </div>

    <div id="overlay-text"></div>

    <script>
        // ==========================================
        // ATENÇÃO: COLE A URL DA SUA PLANILHA (APPS SCRIPT) AQUI:
        const URL_SISTEMA = "https://script.google.com/macros/s/AKfycbz7TsV7a_0ugkC2xZwO0rznEj80AU1r-9YlP6gJ2y9MDPZhdr7NKEII4mDs7Sh-ysq3/exec";
        // ==========================================

        // --- RASTREAMENTO E MAPEAMENTO DO OPERADOR ---
        const parametrosUrl = new URLSearchParams(window.location.search);
        const idOperador = parametrosUrl.get('op');

        const listaOperadores = {
            'matoso': 'Cap Matoso',
            'leonardo': 'Sd Leonardo',
            'donda': 'Cb Donda',
            'brito': 'SO Brito'
        };

        const nomeResponsavel = listaOperadores[idOperador] || 'Não Identificado';

        // Atualiza o texto na tela assim que o documento carregar
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('info-operador').innerText = "Operador(a): " + nomeResponsavel;
        });

        const dataHoje = new Date().toLocaleDateString('pt-BR');
        const nomeLista = 'codigos_lidos_' + dataHoje;
        let codigosLidosHoje = JSON.parse(localStorage.getItem(nomeLista)) || [];

        // Sistema de Áudio
        function tocarBipSucesso() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'square'; 
                oscillator.frequency.value = 800; 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function tocarBipErro() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sawtooth'; 
                oscillator.frequency.value = 300; 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }

        // Limpar Trava Diária
        function limparMemoriaHoje() {
            if(confirm("Tem certeza que deseja zerar a memória do leitor? Todos poderão passar novamente hoje.")) {
                localStorage.removeItem(nomeLista); 
                codigosLidosHoje = []; 
                alert("✅ Memória zerada com sucesso!");
            }
        }

        let ultimoLido = "";
        let timerEsconderTexto;

        // Função Central de Lógica de Registro
        function executarFluxoRegistro(textoIdentificador) {
            let overlayTexto = document.getElementById('overlay-text');
            document.getElementById('scanner-wrapper').appendChild(overlayTexto);
            
            overlayTexto.style.display = "block"; 
            clearTimeout(timerEsconderTexto); 

            // Checa Duplicidade
            if (codigosLidosHoje.includes(textoIdentificador)) {
                tocarBipErro();
                overlayTexto.className = "erro-overlay";
                overlayTexto.innerText = "⚠️ Esse código já foi lido hoje!\n(" + textoIdentificador + ")";
            } else {
                // Sucesso
                codigosLidosHoje.push(textoIdentificador);
                localStorage.setItem(nomeLista, JSON.stringify(codigosLidosHoje));

                tocarBipSucesso();
                overlayTexto.className = "sucesso-overlay";
                overlayTexto.style.fontSize = textoIdentificador.length > 15 ? "1.5em" : "2.5em";
                overlayTexto.innerText = textoIdentificador;

                // Disparo para o Google Planilhas enviando Código + Operador
                if (URL_SISTEMA) {
                    fetch(URL_SISTEMA, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: "codigo=" + encodeURIComponent(textoIdentificador) + "&responsavel=" + encodeURIComponent(nomeResponsavel)
                    }).catch(err => console.log("Erro ao enviar dados:", err));
                }
            }

            timerEsconderTexto = setTimeout(() => { 
                overlayTexto.style.display = "none";
                ultimoLido = ""; 
            }, 2500);
        }

        // Leitura Câmera
        function onScanSuccess(decodedText, decodedResult) {
            if (decodedText === ultimoLido) return;
            ultimoLido = decodedText;
            executarFluxoRegistro(decodedText);
        }

        function onScanFailure(error) { }

        // Inicializa o Leitor
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 250 } });
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
