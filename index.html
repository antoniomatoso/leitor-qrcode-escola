<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Entrada</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 15px; 
            background-color: #f0f2f5; 
            margin: 0;
        }
        h2 { color: #333; margin-bottom: 20px; font-size: 24px; }
        
        /* NOVO EMBRULHO: Necessário para sobrepor o texto no vídeo */
        #scanner-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        #reader { 
            width: 100%; 
            border: none !important; 
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1); 
            box-sizing: border-box;
        }

        /* --- MENSAGEM SOBREPOSTA NO VÍDEO --- */
        #overlay-text {
            position: absolute;
            top: 40%; /* Posicionado um pouco acima do meio, dentro do quadrado de leitura */
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            font-weight: bold;
            text-align: center;
            width: 90%;
            pointer-events: none; /* Garante que o texto não atrapalhe cliques na tela */
            display: none;
        }

        /* Estilo para Leitura com Sucesso (Verde, sem fundo, com sombra) */
        .sucesso-overlay {
            color: #25d366; /* Verde bem vivo */
            font-size: 3em;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8), -2px -2px 5px rgba(0,0,0,0.8);
        }

        /* Estilo para Leitura Duplicada (Erro) */
        .erro-overlay {
            color: #dc3545;
            font-size: 1.5em;
            background: rgba(255, 255, 255, 0.95); /* Fundo branco levemente transparente para leitura fácil */
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            text-shadow: none;
        }

        /* Estilização dos botões e menus mantida */
        #reader button {
            background-color: #0056b3; 
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%; 
            margin-top: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 86, 179, 0.3);
            text-transform: uppercase;
        }

        #reader button:active { background-color: #004085; transform: scale(0.98); }

        #reader select {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #fff;
            color: #333;
            appearance: auto; 
        }

        #reader a {
            display: block;
            padding: 15px 10px;
            font-size: 16px;
            color: #555;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        #reader a:active { background-color: #e2e6ea; }
    </style>
</head>
<body>

    <h2>Controle de Entrada</h2>
    
    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div id="overlay-text"></div>
    </div>

    <script>
        // --- SISTEMA DE MEMÓRIA DE LEITURA ---
        const dataHoje = new Date().toLocaleDateString('pt-BR');
        const nomeLista = 'codigos_lidos_' + dataHoje;
        let codigosLidosHoje = JSON.parse(localStorage.getItem(nomeLista)) || [];

        // --- SISTEMA DE ÁUDIO ---
        function tocarBipSucesso() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'square'; 
                oscillator.frequency.value = 800; 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function tocarBipErro() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sawtooth'; 
                oscillator.frequency.value = 300; 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }

        // --- LÓGICA DO SCANNER ---
        let ultimoLido = "";
        let timerEsconderTexto;

        function onScanSuccess(decodedText, decodedResult) {
            if (decodedText === ultimoLido) return;
            ultimoLido = decodedText;
            
            let overlayTexto = document.getElementById('overlay-text');
            overlayTexto.style.display = "block"; // Mostra o texto sobre o vídeo
            
            // Limpa qualquer timer anterior para não esconder o texto cedo demais
            clearTimeout(timerEsconderTexto); 

            if (codigosLidosHoje.includes(decodedText)) {
                // Cenário de Erro (Já lido)
                tocarBipErro();
                overlayTexto.className = "erro-overlay";
                overlayTexto.innerText = "⚠️ Esse código já foi lido hoje!\n(" + decodedText + ")";
            } else {
                // Cenário de Sucesso
                codigosLidosHoje.push(decodedText);
                localStorage.setItem(nomeLista, JSON.stringify(codigosLidosHoje));

                tocarBipSucesso();
                overlayTexto.className = "sucesso-overlay";
                overlayTexto.innerText = decodedText;
            }

            // Faz o texto desaparecer e libera a trava após 2 segundos
            timerEsconderTexto = setTimeout(() => { 
                overlayTexto.style.display = "none";
                ultimoLido = ""; 
            }, 2000);
        }

        function onScanFailure(error) {
            // Ignorado
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 250 } });
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
