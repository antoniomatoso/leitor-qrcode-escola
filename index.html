<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Entrada</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 15px; 
            background-color: #f0f2f5; 
            margin: 0;
        }
        h2 { color: #333; margin-bottom: 20px; font-size: 24px; }
        
        #reader { 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto; 
            border: none !important; 
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1); 
            box-sizing: border-box;
        }

        #reader button {
            background-color: #0056b3; 
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%; 
            margin-top: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 86, 179, 0.3);
            text-transform: uppercase;
        }

        #reader button:active {
            background-color: #004085;
            transform: scale(0.98); 
        }

        #reader select {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #fff;
            color: #333;
            appearance: auto; 
        }

        #reader a {
            display: block;
            padding: 15px 10px;
            font-size: 16px;
            color: #555;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        #reader a:active { background-color: #e2e6ea; }

        #resultado { 
            font-size: 1.5em; 
            font-weight: bold; 
            margin-top: 25px; 
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
            display: none; 
            word-break: break-all;
        }

        /* Classes para mudar a cor do resultado (Sucesso x Erro) */
        .sucesso { color: #28a745; border-left: 5px solid #28a745; }
        .erro { color: #dc3545; border-left: 5px solid #dc3545; }
    </style>
</head>
<body>

    <h2>Controle de Entrada</h2>
    <div id="reader"></div>
    <p id="resultado"></p>

    <script>
        // --- SISTEMA DE MEMÓRIA DE LEITURA ---
        // Pega a data de hoje para criar uma lista diária
        const dataHoje = new Date().toLocaleDateString('pt-BR');
        const nomeLista = 'codigos_lidos_' + dataHoje;
        
        // Carrega os códigos que já foram lidos hoje (ou cria uma lista vazia)
        let codigosLidosHoje = JSON.parse(localStorage.getItem(nomeLista)) || [];

        // --- SISTEMA DE ÁUDIO ---
        // Bipe de sucesso (Agudo e rápido)
        function tocarBipSucesso() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'square'; 
                oscillator.frequency.value = 800; 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        // Bipe de erro (Grave e mais longo)
        function tocarBipErro() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sawtooth'; 
                oscillator.frequency.value = 300; 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }

        // --- LÓGICA DO SCANNER ---
        let ultimoLido = "";

        function onScanSuccess(decodedText, decodedResult) {
            // Trava rápida para a câmera não tentar ler o mesmo QR Code 50 vezes por segundo
            if (decodedText === ultimoLido) return;
            ultimoLido = decodedText;
            setTimeout(() => { ultimoLido = ""; }, 2000); 
            
            let caixaResultado = document.getElementById('resultado');
            caixaResultado.style.display = "block";

            // Verifica se a matrícula já está na lista de hoje
            if (codigosLidosHoje.includes(decodedText)) {
                
                tocarBipErro();
                caixaResultado.className = "erro";
                caixaResultado.innerText = "⚠️ Esse código já foi lido hoje! \n (" + decodedText + ")";
                
            } else {
                
                // Se é um aluno novo, salva na memória do celular
                codigosLidosHoje.push(decodedText);
                localStorage.setItem(nomeLista, JSON.stringify(codigosLidosHoje));

                tocarBipSucesso();
                caixaResultado.className = "sucesso";
                caixaResultado.innerText = "✅ Lido com sucesso: \n" + decodedText;
                
                // Futuramente: Código para enviar ao Google Apps Script entrará aqui!
            }
        }

        function onScanFailure(error) {
            // Ignorado
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 250 } });
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
